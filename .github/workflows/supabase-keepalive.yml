name: Supabase Keepalive

on:
  schedule:
    # every 5 days at 02:17 UTC
    - cron: '17 2 */5 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        env:
          KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
          KEEPALIVE_SECRET: ${{ secrets.KEEPALIVE_SECRET }}
        run: |
          if [ -z "$KEEPALIVE_URL" ]; then
            echo "Missing secret: KEEPALIVE_URL"
            exit 1
          fi
          if [ -z "$KEEPALIVE_SECRET" ]; then
            echo "Missing secret: KEEPALIVE_SECRET"
            exit 1
          fi

      - name: Ping keepalive endpoint (timeout + retry + logs)
        env:
          KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
          KEEPALIVE_SECRET: ${{ secrets.KEEPALIVE_SECRET }}
        run: |
          set -euo pipefail

          echo "[$(date -u +"%Y-%m-%dT%H:%M:%SZ")] Keepalive started"
          echo "Target: ${KEEPALIVE_URL}"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 25 \
            --retry 4 \
            --retry-delay 5 \
            --retry-connrefused \
            --retry-all-errors \
            --header "x-keepalive-secret: ${KEEPALIVE_SECRET}" \
            --output response.json \
            --write-out "%{http_code}" \
            "${KEEPALIVE_URL}")

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response preview:"
          head -c 600 response.json || true
          echo ""

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "Keepalive failed with status ${HTTP_CODE}"
            exit 1
          fi

          echo "[$(date -u +"%Y-%m-%dT%H:%M:%SZ")] Keepalive succeeded"
